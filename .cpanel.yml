---
deployment:
  tasks:
    - /bin/echo "Starting deployment..."
    - /bin/echo "Navigating to frontend directory..."
    - cd frontend
    - /bin/echo "Installing dependencies..."
    - npm install
    - /bin/echo "Building project..."
    - npm run build
    - /bin/echo "Copying built files to public_html..."
    - /bin/cp -R dist/* ~/public_html/
    - /bin/echo "Deployment complete!"

