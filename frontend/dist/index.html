    <!-- Single Page Apps for GitHub Pages (guarded to run only on github.io) -->
    <script type="text/javascript">
      (function(l) {
        try {
          // Only run this rewrite on GitHub Pages hosts to avoid interfering
          // with local dev servers (localhost) where query-based rewrites
          // can break routing.
          if (
            typeof window !== 'undefined' &&
            window.location.hostname &&
            window.location.hostname.indexOf('github.io') !== -1 &&
            l.search[1] === '/'
          ) {
            var decoded = l.search.slice(1).split('&').map(function(s) {
              return s.replace(/~and~/g, '&')
            }).join('?');
            window.history.replaceState(null, null,
                l.pathname.slice(0, -1) + decoded + l.hash
            );
          }
        } catch (e) {
          /* noop in dev */
        }
      }(window.location))
